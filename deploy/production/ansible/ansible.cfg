[defaults]
# Run every command from this directory so this file, roles/, and group_vars/
# are all picked up:
#   cd deploy/production/ansible && ansible-playbook -i inventory.yml playbooks/verify.yml
roles_path = roles
inventory = inventory.yml
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
display_skipped_hosts = False
forks = 10
timeout = 30
# Roles never write secrets to disk on the controller and never emit them in
# task output. Keep this off so a stray fact cache cannot become a leak.
fact_caching = memory
# Fail the whole play the moment a host fails a fail-closed assertion, on
# every playbook in this bundle. Plays may still opt out explicitly with
# `any_errors_fatal: false` if they intentionally want to isolate a failure
# to one host (none currently do).
any_errors_fatal = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
scp_if_ssh = smart
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
