name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile packages
        run: python -m compileall ocr_parser dots_ocr ocr_platform

      - name: Run tests
        run: pytest tests

      - name: Check documentation links
        run: python tools/check_docs_links.py

      - name: Check Control architecture debt
        run: python tools/control_architecture_debt.py check

      - name: Check Control service facade inventory
        run: python tools/control_facade_inventory.py check

      - name: Validate engine certification records
        run: python tools/check_engine_certifications.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Verify wheel build provenance
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          WHEEL="$WHEEL" python - <<'PY'
          import json
          import os
          import zipfile
          with zipfile.ZipFile(os.environ["WHEEL"]) as archive:
              payload = json.loads(archive.read("ocr_platform/_build_info.json"))
          assert payload["source_revision"] == os.environ["GITHUB_SHA"]
          assert payload["dirty"] is False
          assert payload["build_timestamp"].endswith("Z")
          PY
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python tools/verify_release_build.py "$WHEEL" --tag "${GITHUB_REF_NAME}"
          fi
      - name: Install wheel in an empty environment
        run: |
          python -m venv /tmp/ocrparser-wheel
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          EXPECTED_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          /tmp/ocrparser-wheel/bin/python -m pip install "${WHEEL}[platform]"
          /tmp/ocrparser-wheel/bin/python tools/check_installed_console_scripts.py --bin-dir /tmp/ocrparser-wheel/bin
          # Avoid the build-created source-tree egg-info shadowing the wheel's
          # installed dist-info during metadata and license inventory checks.
          cd /tmp
          EXPECTED_VERSION="$EXPECTED_VERSION" /tmp/ocrparser-wheel/bin/python - <<'PY'
          from importlib.resources import files
          from importlib.metadata import distribution, entry_points, version
          import os
          from pathlib import Path
          assert version("ocrparser-platform") == os.environ["EXPECTED_VERSION"]
          names = {item.name for item in entry_points(group="console_scripts")}
          assert {
              "ocr-parser",
              "ocr-platform-control",
              "ocr-platform-agent",
              "ocr-platform-migrate",
          } <= names
          for ui_asset in (
              "index.html", "styles.css", "main.js", "api.js", "auth.js",
              "state.js", "jobs.js", "workers.js", "profiles.js",
              "diagnostics.js", "remote-admin.js",
          ):
              assert files("ocr_platform.control").joinpath(f"ui/{ui_asset}").is_file()
          assert files("ocr_platform.control").joinpath(
              "migrations/0020_model_profile_certification.sql"
          ).is_file()
          license_names = {
              Path(str(item)).name
              for item in distribution("ocrparser-platform").files or []
              if "/licenses/" in str(item)
          }
          assert {
              "LICENSE",
              "NOTICE",
              "AGPL_3.0.txt",
              "APACHE_2.0.txt",
              "DOTS_OCR_LICENSE.txt",
          } <= license_names
          PY

  install-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [base, platform, s3, layout, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Install and verify ${{ matrix.profile }} profile
        run: |
          PROFILE="${{ matrix.profile }}"
          VENV="/tmp/ocrparser-${PROFILE}"
          python -m venv "$VENV"
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          SPEC="$WHEEL"
          if [[ "$PROFILE" != "base" ]]; then
            SPEC="${WHEEL}[${PROFILE}]"
          fi
          "$VENV/bin/python" -m pip install "$SPEC"
          "$VENV/bin/python" tools/check_install_profile.py \
            --profile "$PROFILE" \
            --bin-dir "$VENV/bin" \
            --repo-root "$PWD"
          if [[ "$PROFILE" == "platform" || "$PROFILE" == "full" ]]; then
            "$VENV/bin/python" tools/check_installed_console_scripts.py --bin-dir "$VENV/bin"
          fi

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocr_platform
          POSTGRES_PASSWORD: ocr_platform
          POSTGRES_DB: ocr_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocr_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Prepare the v0.3.1 migration state
        run: |
          mkdir -p /tmp/ocrparser-migrations-0019
          find ocr_platform/control/migrations -maxdepth 1 -name '*.sql' \
            ! -name '0020_model_profile_certification.sql' \
            -exec cp {} /tmp/ocrparser-migrations-0019/ \;
          ocr-platform-migrate apply \
            --database-url "$DATABASE_URL" \
            --migrations-dir /tmp/ocrparser-migrations-0019
          ocr-platform-migrate verify \
            --database-url "$DATABASE_URL" \
            --migrations-dir /tmp/ocrparser-migrations-0019
        env:
          DATABASE_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform
      - name: Upgrade 0019 to 0020 under concurrent apply
        run: |
          ocr-platform-migrate apply --database-url "$DATABASE_URL" > /tmp/migrate-1.json &
          first_pid=$!
          ocr-platform-migrate apply --database-url "$DATABASE_URL" > /tmp/migrate-2.json &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
        env:
          DATABASE_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform
      - name: Verify migration history and checksums
        run: ocr-platform-migrate verify --database-url "$DATABASE_URL"
        env:
          DATABASE_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform
      - name: Verify PostgreSQL migration, ORM, and shard recovery contracts
        run: >-
          python -m pytest -q
          tests/test_postgres_migration_bridge.py
          tests/test_control_bootstrap.py
          tests/test_postgres_shard_recovery.py
        env:
          OCR_TEST_POSTGRES_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform
      - name: Verify fresh PostgreSQL bootstrap is migration-first
        run: |
          python - <<'PY'
          import os
          import psycopg
          from fastapi.testclient import TestClient
          from sqlalchemy import text

          from ocr_platform.control import database
          from ocr_platform.control.app import create_app
          from ocr_platform.control.bootstrap import bootstrap_control_database
          from ocr_platform.control.domains.common import DEFAULT_MODEL_PROFILES
          from ocr_platform.control.migration import MigrationRunner
          from ocr_platform.control.settings import ControlSettings

          with psycopg.connect(
              "postgresql://ocr_platform:ocr_platform@127.0.0.1:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE ocr_platform_fresh")

          database_url = os.environ["FRESH_DATABASE_URL"]
          session_factory, engine = database.create_session_factory(database_url)
          original_create_all = database.Base.metadata.create_all
          original_compat = database._ensure_compatible_schema
          original_indexes = database._ensure_production_indexes

          def fail_implicit_ddl(*args, **kwargs):
              raise AssertionError("PostgreSQL startup must not use ORM or compatibility DDL")

          database.Base.metadata.create_all = fail_implicit_ddl
          database._ensure_compatible_schema = fail_implicit_ddl
          database._ensure_production_indexes = fail_implicit_ddl
          try:
              startup_settings = ControlSettings(
                  database_url=database_url,
                  auto_migrate=False,
              )
              database.init_db(engine, settings=startup_settings)
              with engine.connect() as connection:
                  assert connection.execute(
                      text("SELECT to_regclass('schema_migrations')")
                  ).scalar_one() is None
                  assert connection.execute(
                      text("SELECT to_regclass('model_profile_certifications')")
                  ).scalar_one() is None

              app = create_app(
                  session_factory=session_factory,
                  settings=startup_settings,
              )
              with TestClient(app) as client:
                  assert client.get("/healthz").status_code == 200
                  not_ready = client.get("/readyz")
                  assert not_ready.status_code == 503
                  assert not_ready.json()["code"] == "control_database_not_ready"
                  assert client.get("/api/servers").status_code == 503

                  database.init_db(
                      engine,
                      settings=ControlSettings(
                          database_url=database_url,
                          auto_migrate=True,
                          require_current_migrations=True,
                      ),
                  )
                  assert client.get("/readyz").status_code == 200
                  assert client.get("/api/servers").status_code == 200
                  assert client.get("/api/model-profiles").json() == []
                  bootstrap = bootstrap_control_database(
                      session_factory,
                      engine,
                  )
                  assert bootstrap.status == "complete"
                  profiles = client.get("/api/model-profiles")
                  assert profiles.status_code == 200
                  assert {item["id"] for item in profiles.json()} == set(
                      DEFAULT_MODEL_PROFILES
                  )
              with engine.connect() as connection:
                  assert connection.execute(
                      text("SELECT to_regclass('model_profile_certifications')")
                  ).scalar_one() == "model_profile_certifications"
                  assert connection.execute(
                      text(
                          "SELECT COUNT(*) FROM information_schema.columns "
                          "WHERE table_schema = current_schema() "
                          "AND table_name = 'schema_migrations' "
                          "AND column_name = 'checksum'"
                      )
                  ).scalar_one() == 1
                  assert connection.execute(
                      text(
                          "SELECT COUNT(*) FROM schema_migrations "
                          "WHERE version = '0020_model_profile_certification' "
                          "AND checksum IS NOT NULL"
                      )
                  ).scalar_one() == 1
              verification = MigrationRunner(engine).verify()
              assert verification["verified"] is True
              assert verification["checksum_mismatches"] == []
              assert verification["missing_checksums"] == []
          finally:
              database.Base.metadata.create_all = original_create_all
              database._ensure_compatible_schema = original_compat
              database._ensure_production_indexes = original_indexes
              engine.dispose()
          PY
        env:
          FRESH_DATABASE_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform_fresh
      - name: Verify concurrent shard and scan-unit claims
        run: >-
          python tools/pg_claim_stress.py --database-url "$DATABASE_URL"
          --apply-init-db --shards 32 --workers 8 --scan-units 8
          --scan-unit-shards 2 --json
        env:
          DATABASE_URL: postgresql+psycopg://ocr_platform:ocr_platform@127.0.0.1:5432/ocr_platform

  mock-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Control to Artifact walkthrough
        run: python tools/run_mock_e2e.py
